image: $ARTIFACTORY_DOCKER_DEV_REPOSITORY/gitlabci.docker/web-development:node16

cache:
  untracked: true
  paths:
    - node_modules/
  key: ${CI_PROJECT_PATH_SLUG}-${CI_COMMIT_REF_SLUG}

before_script:
  - yarn

stages:
  - build
  - publish

build:
  stage: build
  script:
    - yarn build
  tags:
    - Linux
    - DockerExecutor
  artifacts:
    name: "$CI_JOB_NAME"
    expire_in: 1 hour
    when: always
    paths:
      - dist

publish:
  stage: publish
  script:
    - npm publish --$ARTIFACTORY_NPM_REGISTRY
  tags:
    - Linux
    - DockerExecutor
  only:
    - master
  only:
    - tags
  cache:
    policy: pull
    key: ${CI_PROJECT_PATH_SLUG}-${CI_COMMIT_REF_SLUG}
  dependencies:
    - build
