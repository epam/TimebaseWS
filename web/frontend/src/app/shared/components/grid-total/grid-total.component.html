<ng-container *ngIf="dataCount$ | async as dataCount">
  {{ 'gridTotal.loaded' | translate : {number: dataCount.number} }}
  <ng-container>
    <ng-container *ngIf="dataCount.fromCache" >{{ 'gridTotal.fromCache' | translate }}</ng-container>
    {{ 'gridTotal.inSec' | translate : {seconds: dataCount.time / 1000} }}
  </ng-container>
</ng-container>
