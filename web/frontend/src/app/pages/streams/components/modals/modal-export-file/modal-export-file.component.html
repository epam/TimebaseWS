<app-modal>
  <ng-container title>
    {{ 'exportToFile.title.' + exportFormat | translate: {stream: stream} }}
  </ng-container>
  <div [formGroup]="form" class="export-file-content" content>
    <label>{{ 'exportToFile.headers.dateRange' | translate }}:</label>
    <app-date-range-picker
        [maxDate]="maxDate"
        [minDate]="minDate"
        formControlName="range"
        [timeRangeOptional]="timeRangeOptional"
        [timezone]="timezoneName"
        [timeInvalid]="timeInvalid"
        (setTimeRangeState)="setTimeRangeState($event)"></app-date-range-picker>
    <label>{{ 'exportToFile.headers.datetimeFormat' | translate }}:</label>
    <div>
      <deltix-ng-autocomplete
        cssClass="in-modal"
        [values]="dateTimeFormats"
        [free]="true"
        formControlName="datetimeFormat">
      </deltix-ng-autocomplete>
    </div>
    <div *ngIf="importToTextFile" class="form-group">
      <div class="form-control-cb-wr">
        <label class="container-ch">
          <input type="checkbox" formControlName="exportStaticFields"/>
          <span class="checkmark"></span>
          {{ 'exportToFile.labels.exportStaticFields' | translate }}
        </label>
      </div>
    </div>
    <accordion [closeOthers]="true">
      <accordion-group [isOpen]="!!symbols" [heading]="symbolsHeader$ | async">
        <app-multi-select-autocomplete
            [autocompleteProvider]="autoCompleteProvider"
            formControlName="symbols"
            notFoundText="No symbols found"></app-multi-select-autocomplete>
      </accordion-group>
      <accordion-group [heading]="fieldsHeader$ | async">
        <app-tree-checkboxes [tree]="tree$ | async" formControlName="fields"></app-tree-checkboxes>
      </accordion-group>
      <accordion-group [heading]="configHeader$ | async">
        <ng-container *ngTemplateOutlet="configRow; context: { field: 'exportTo' }"></ng-container>
        <ng-container
            *ngTemplateOutlet="configRow; context: { field: 'delimiters' }"></ng-container>
        <ng-template #configRow let-field="field">
          <div *ngIf="configData[field]" class="config-row">
            <label>{{ 'exportToFile.config.' + field | translate }}:</label>
            <div [formControlName]="field" btnRadioGroup class="btn-group radio-group">
              <button
                  *ngFor="let button of configData[field]"
                  [btnRadio]="button"
                  class="btn btn-default">
                {{ 'exportToFile.config.' + button | translate }}
              </button>
            </div>
          </div>
        </ng-template>
      </accordion-group>
    </accordion>
  </div>
  <ng-container footer>
    <div class="validation-error">
      <ng-container *ngFor="let message of validationErrorMessages | keyvalue: originalOrder">
        <div *ngIf="!!message.value" class="error-message" [class.error-message-not-empty]="!!message.value">
          {{ message.value }}</div>
      </ng-container>
    </div>
    <button (click)="export()" class="btn btn-primary" [disabled]="submitButtonDisabled$ | async"
      [tooltip]="'exportToFile.exportToFile' | translate: {filetype: exportFormat}" container="body">
      {{ 'exportToFile.export' | translate }}
    </button>
  </ng-container>
</app-modal>
