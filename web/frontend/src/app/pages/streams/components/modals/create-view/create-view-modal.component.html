<app-resizable [minWidth]="600" [minHeight]="400" [storageKey]="'create-view-modal-size'" 
  [contentClassName]="'monaco-wrapper'" [contentHeightDifference]="230" [modalBodyHeightDifference]="120">
  <app-modal [formGroup]="form">
    <ng-container title>
      {{ 'createViewModal.title' | translate }}
      <ng-container *ngIf="timebases$ | async as timebases">
        <select *ngIf="timebases.length > 1"
                class="db-selector"
                [class.db-selector-error]="selectedTbUnavailable"
                (change)="onTbChange($event.target['value'])">
          <option *ngFor="let tb of timebases" [value]="tb.id" [selected]="tb.id === tbId"
                  [disabled]="tb.connected === false"
                  [title]="tb.connected === false ? (tb.errorMessage || 'Timebase is unavailable') : null">{{ tb.id }}{{ tb.connected === false ? ' (unavailable)' : '' }}</option>
        </select>
        <span *ngIf="timebases.length === 1 && tbId" class="db-indicator" [class.db-selector-error]="selectedTbUnavailable">{{ tbId }}</span>
      </ng-container>
      <span *ngIf="selectedTbUnavailable" class="db-selector-hint">Selected timebase is unavailable.</span>
    </ng-container>
    <ng-container content>
      <div class="controlWr">
        <label class="btn control-label"> {{ 'qqlEditor.createViewModal.viewName' | translate }} </label>
        <input appAutofocus formControlName="title" class="btn input-control"></div>
      <div
          *ngIf="(form.get('title').invalid && form.get('title').touched) || form.get('title').hasError('specialSymbols')"
          class="alert alert-danger error-alert"
      >
        <ng-container *ngIf="form.get('title').hasError('required')">
          {{ 'createViewModal.errors.required' | translate }}
        </ng-container>
        <ng-container *ngIf="form.get('title').hasError('specialSymbols')">
          {{ 'createViewModal.errors.forbiddenSymbolsError' | translate }}
        </ng-container>
        <ng-container *ngIf="form.get('title').hasError('beError')">
          {{ beErrorText || ('createViewModal.errors.duplicateName' | translate) }}
        </ng-container>
      </div>
      <div>
        <app-qql-editor formControlName="query" [tbId]="tbId" (onQueryChange)="queryChanged($event)" (setEditorAsReady)="setEditorAsReady()">
        </app-qql-editor>
        <div *ngIf="!(editorIsReady$ | async)" class="editor-loading">
          <div class="editor-loading-text">Loading</div>
        </div>
      </div>
    </ng-container>
    <ng-container footer>
      <div class="form-check live-view-checkbox">
        <input class="form-check-input" type="checkbox" formControlName="live">
        <label class="form-check-label">
          {{ 'createViewModal.liveView' | translate }}
        </label>
      </div>
      <button (click)="createView()"
        [disabled]="titleControl.invalid || isLiveControl.invalid || form.pending || qureryError || selectedTbUnavailable"
        class="btn btn-primary">
        {{ 'createViewModal.createView' | translate }}
      </button>
    </ng-container>
  </app-modal>
</app-resizable>
