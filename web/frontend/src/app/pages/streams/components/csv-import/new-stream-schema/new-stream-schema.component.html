<h4>{{ 'importFromFile.stepHeaders.streamSchema' | translate }}</h4>
<div class="container">
  <h6>
    <div class="use-column-header">Use</div>
    <div>Title</div>
  </h6>
  <div class="stream-schema">
    <div class="type-list">
      <ng-container *ngFor="let schemaItem of schemaItems">
        <div class="row schema-item-controls">
          <div class="form-check">
            <app-is-used-cb [data]="{ checked: schemaItem.use, readonly: true }"></app-is-used-cb>
          </div>
          <div
            [class.visible]="schemaItem.fields?.length"
            [class.open]="schemaItem.fieldsOpen"
            class="sidebar-arrow"
            (click)="toggleFieldsVisibility(schemaItem.name)">
            <ng-container *ngTemplateOutlet="arrowIcon"></ng-container>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" [checked]="schemaItem.checked" 
              (change)="typeListChanged($event, schemaItem)">
            <label class="form-check-label schema-item-label">
              {{ schemaItem.name }}
              <span *ngFor="let parent of schemaItem.hierarchy" class="hierarchy">
                <ng-container *ngTemplateOutlet="rightArrowIcon"></ng-container>
                {{ parent }} 
              </span>
            </label>
          </div>
        </div>
        <div *ngIf="schemaItem.fieldsOpen" class="type-fields">
          <div *ngFor="let field of schemaItem.fieldList" class="form-check field-checkbox">
            <input class="form-check-input" type="checkbox" [checked]="field.checked" 
              (change)="fieldListChanged($event, schemaItem, field.name)">
            <label class="form-check-label schema-item-label">
              {{ field.name }} 
              <span class="field-type">({{ field.type.name }})</span>
            </label>
          </div>
        </div>
      </ng-container>
    </div>
  </div>
</div>

    s7.678-1.465,10.606-4.394l75-75c5.858-5.857,5.858-15.355,0-21.213l-75-75c-5.857-5.857-15.355-5.857-21.213,0
    c-5.858,5.857-5.858,15.355,0,21.213L278.787,150H15c-8.284,0-15,6.716-15,15S6.716,180,15,180z"/>
  </svg>
</ng-template>
