<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>SilentAuth</title>
    Redirection page
    <script>
      (function () {
        const REDIRECT_URI = '/silent-auth';
        document.addEventListener('DOMContentLoaded', function () {
          const queryString = (window.location.hash === '' ? window.location.search : window.location.hash).substr(1);
          const path = [REDIRECT_URI, queryString].join('#');
          console.log("redirect-url", path)
          window.location.assign(path);
        });
      })();
    </script>
  </head>
  <body>
  </body>
</html>
