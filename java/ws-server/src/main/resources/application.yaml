# EMBEDDED SERVER CONFIGURATION (ServerProperties)
server:
  port: 8099
  error:
    include-message: always
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,application/json
spring:
  mvc:
    async:
      request-timeout: 3600000 # 60 * 60 * 1000  = 1 hour
  web:
    resources:
      cache:
        cachecontrol:
          no-store: true
          no-cache: true
          must-revalidate: true
          proxy-revalidate: true
          max-age: 0
management:
  endpoints:
    web:
      exposure:
        include: "metrics,prometheus"
timebase:
  url: dxtick://localhost:8011
  readonly: false
  flushPeriodMs: 500
  user:
  password:
  streams:
    include:
    exclude: \#$ && \^metrics#
  currencies:
  tree:
    group-size: 1000
grafana:
  pluginsPackages:
    - com.epam.deltix.grafana
  enabled: true
  streams:
  include: .*
  exclude:
security:
  oauth2:
    provider:
      name: spring
      providerType: BUILT_IN_OAUTH # valid values: EXTERNAL_OAUTH, BUILT_IN_OAUTH, SSO
      clientId:
      oauthServer: http://localhost:8099
      getTokenEndpoint: /oauth2/token
      checkTokenEndpoint: /oauth2/jwks
      scopes:
        - openid
        - profile
    users:
      - username: admin
        password: $2a$10$7M3W5JMk1wggimrbVegxWeeasqjrZUjNEiZTpMSYdId92409D2TSq
        authorities: [TB_ALLOW_READ, TB_ALLOW_WRITE]
      - username: reader
        password: $2a$12$ZEIAFaexgqAg2ROMawHs2OXMDSFsBohkZkU8NCS5xWviLw2Ay/xt.
        authorities: [ TB_ALLOW_READ]
        aiApiKey: SOME_AI_KEY # key from ai-api.keys section has priority
      - username: test
        password: $2a$10$3PL6X1Gn8VjRy4r0od9NLeZrO2YWpUjzozv3jOxU0/RMjsElzPQdu
        authorities: [TB_ALLOW_READ, TB_ALLOW_WRITE]
        aiApiKey: TEST_AI_KEY # ai api key for test user
#    contentSecurityPolicy: "default-src 'self';
#      style-src 'self' 'unsafe-inline';
#      img-src 'self' data: 'unsafe-inline';
#      font-src 'self' data: 'unsafe-inline';
#      worker-src 'self' data: 'unsafe-inline' blob: 'unsafe-inline';
#      connect-src 'self' https://login.microsoftonline.com/;
#      script-src 'self' 'nonce-aykJK1CokURPt5Tb+ikxSA==';"
    accessTokenValiditySeconds: 86400 # one day

ai-api:
  enabled: true
  endpointUrl: "" # endpoint must support Azure OpenAI API
  deploymentName: gpt-5-mini-2025-08-07 # deployment for QQL generation
  embeddingDeploymentName: text-embedding-3-small-1 # deployment for embeddings
  keys: # ai api keys per user
    - username: admin
      key: ${ADMIN_AI_KEY} # resolves from environment variable
    - username: reader
      key: READER_AI_KEY # takes priority over key from security.oauth2.users section
  maxAttempts: 3 # max attempts allowed for an AI to produce a valid QQL query
